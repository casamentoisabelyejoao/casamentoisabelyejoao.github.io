# Visita o banco a cada 3 dias para o Supabase (plano grátis) não pausar o projeto por falta de uso.
name: Manter banco ativo
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar o banco
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' js/config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' js/config.js)
          curl -sf -X POST "$URL/rest/v1/rpc/list_selected_gifts" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
